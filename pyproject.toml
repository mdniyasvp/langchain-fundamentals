[project]
name = "langchain-fundamentals"
version = "0.1.0"
description = "Hands-on practice with LangChain fundamentals, local LLMs, LCEL chains, document loading, and document question answering."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "pydantic>=2.14.3",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
